<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web Torrent Downloader with a retro CRT terminal interface">
    <title>Torrent-CLI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="terminal-output"></div>
        <div id="input-line">
            <span class="prompt">torrent@web:~$ </span>
            <input id="command-input" type="text" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    <div id="scanlines"></div>
    <div id="drop-overlay"><div>DROP .torrent FILE HERE</div></div>
    <input type="file" id="file-input" accept=".torrent" style="display: none;">
    <script src="app.js"></script>
</body>
</html>
